<script>
(function(){
  var ITER = 310000, SK = 'mp.plain';
  var f = document.getElementById('f'), pw = document.getElementById('pw'),
      go = document.getElementById('go'), msg = document.getElementById('msg');

  function render(html){
    try { sessionStorage.setItem(SK, html); } catch(e) {}
    // document.write, not innerHTML: injected <script> elements are flagged
    // already-started by the parser and would never run.
    document.open(); document.write(html); document.close();
  }
  try { var c = sessionStorage.getItem(SK); if (c) { render(c); return; } } catch(e) {}

  if (!window.isSecureContext || !crypto.subtle) {
    msg.className = 'err';
    msg.textContent = 'Open the https:// address, not a downloaded copy.';
    go.disabled = true; return;
  }
  function b64(s){ var b = atob(s), u = new Uint8Array(b.length);
    for (var i = 0; i < b.length; i++) u[i] = b.charCodeAt(i); return u; }

  f.addEventListener('submit', function(ev){
    ev.preventDefault();
    go.disabled = true; msg.className = ''; msg.textContent = 'Unlocking...';
    var t0 = Date.now();
    var raw = b64(document.getElementById('payload').textContent.trim());
    crypto.subtle.importKey('raw', new TextEncoder().encode(pw.value), 'PBKDF2', false, ['deriveKey'])
      .then(function(km){ return crypto.subtle.deriveKey(
        {name:'PBKDF2',salt:raw.subarray(0,16),iterations:ITER,hash:'SHA-256'},
        km, {name:'AES-GCM',length:256}, false, ['decrypt']); })
      .then(function(k){ return crypto.subtle.decrypt(
        {name:'AES-GCM',iv:raw.subarray(16,28)}, k, raw.subarray(28)); })
      .then(function(buf){ console.log('unlock ms', Date.now()-t0);
        render(new TextDecoder().decode(buf)); })
      .catch(function(){ go.disabled = false; msg.className = 'err';
        msg.textContent = 'Wrong password.'; pw.value = ''; pw.focus(); });
  });
  pw.focus();
})();
</script>
